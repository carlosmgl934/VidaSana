<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💚</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VidaSana" />
    <meta name="description" content="Tu compañero inteligente de salud, dieta y fitness con IA" />
    <title>VidaSana — Salud & Fitness con IA</title>
    <link rel="manifest" href="/manifest.json" />
    <!-- PWA Manifest inline fallback -->
    <script>
      // Register minimal PWA manifest programmatically if needed
      const manifest = {
        name: "VidaSana — Salud & Fitness",
        short_name: "VidaSana",
        description: "Tu compañero inteligente de salud con IA",
        start_url: "/",
        display: "standalone",
        background_color: "#0f172a",
        theme_color: "#10b981",
        orientation: "portrait",
        icons: [
          { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💚</text></svg>", sizes: "192x192", type: "image/svg+xml" }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = url;
      document.head.appendChild(link);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
